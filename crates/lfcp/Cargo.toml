[package]
name = "lfcp"
description = "Independent Rust implementation of LFCP."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Default features are disabled so every enabled feature is listed and
# justified. No CBOR crate: the codec is hand-written (src/cbor.rs).

# SHA-256 for hash32, Principal IDs and object IDs (WIRE §5.3, §7, §10.6).
sha2 = { version = "0.11", default-features = false }
# Ed25519 signatures (WIRE §9, §10.5). "fast" uses precomputed tables;
# "zeroize" wipes signing keys on drop.
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
# X25519 public keys of Principals (WIRE §7). "static_secrets" provides a
# reusable private key, which a Principal's long-term key is; "zeroize"
# wipes it on drop.
x25519-dalek = { version = "3", default-features = false, features = ["precomputed-tables", "static_secrets", "zeroize"] }
# HKDF-SHA256 for the actor and snapshot keys (WIRE §9, §12, §29.1.1). It
# has no optional features this crate needs.
hkdf = { version = "0.13", default-features = false }
# ChaCha20-Poly1305 for Data Units and Snapshots (WIRE §9, §12, §29.1.4).
# "alloc" provides the Vec-returning seal and open; "zeroize" wipes the
# cipher's key schedule on drop. "getrandom" stays off: LFCP nonces are
# derived from sequence numbers, never random.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
# HPKE (RFC 9180) Base mode for Key Packages: DHKEM(X25519, HKDF-SHA256),
# HKDF-SHA256, ChaCha20-Poly1305 (WIRE §9, §25). "x25519" (implies
# "hkdfsha2") and "chacha" select exactly that suite and reuse the
# x25519-dalek, hkdf, sha2 and chacha20poly1305 versions above; "alloc"
# provides Vec-returning seal and open; "getrandom" gives sealing a fresh
# OS-random ephemeral key, which RFC 9180 requires. The default ML-KEM,
# SHAKE and NIST-curve features stay off.
hpke = { version = "0.14.1", default-features = false, features = ["x25519", "chacha", "alloc", "getrandom"] }
# Wipes DEKs, derived keys and HPKE plaintexts on drop; "alloc" covers the
# Vec-held HPKE plaintext. Already in the tree through the
# dalek crates; used directly for this crate's own key types.
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
serde_json = "1"
