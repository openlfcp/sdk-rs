name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-rs
    steps:
      - uses: actions/checkout@v4
        with:
          path: sdk-rs
      # Tests read official vectors from a spec checkout next to this
      # repository (../spec) at the tag pinned in spec.lock, or at its
      # commit when the lock pins a development commit without a tag.
      - id: spec-lock
        run: echo "ref=$(jq -er 'if .tag then "refs/tags/" + .tag else .commit end' spec.lock)" >> "$GITHUB_OUTPUT"
      # Full history with tags, so the tests can check that the tag still
      # resolves to the commit in spec.lock.
      - uses: actions/checkout@v4
        with:
          repository: openlfcp/spec
          ref: ${{ steps.spec-lock.outputs.ref }}
          path: spec
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # The default build is the protocol core only (no Automerge); the
      # shared-objects feature adds the profile. Both must stay clean.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - run: cargo test --workspace --all-features
